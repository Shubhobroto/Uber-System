spring.application.name=Uber

spring.datasource.url=jdbc:h2:mem:uber-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080

# Redis / RabbitMQ (docker compose up -d starts both)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.rabbitmq.host=${RABBIT_HOST:localhost}

# Publisher confirms: know when the broker has actually taken a ride request
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Consumer: bounded prefetch + a few concurrent workers, retry with backoff,
# then reject without requeue so the queue's dead-letter exchange parks the message.
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=8
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Matching tunables (see MatchingProperties)
app.matching.search-radii-km=2,5,10
app.matching.max-candidates=20
app.matching.offer-timeout=10s
app.matching.driver-stale-after=30s
app.matching.max-radius-km=25
app.matching.timeout-poll-ms=1000
app.matching.stale-sweep-ms=10000

# Restrict to your real front-end origins outside local development
app.websocket.allowed-origins=*

# Metrics: /actuator/metrics and /actuator/prometheus (latency histograms for the matching path)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.matching=true
management.metrics.distribution.percentiles.matching=0.5,0.95,0.99

